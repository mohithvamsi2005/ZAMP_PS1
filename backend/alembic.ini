# Alembic configuration for Zamp Invoice Intelligence.
#
# The database URL is resolved from the DATABASE_URL environment variable
# (migrations/env.py), falling back to the settings default.
#
# Common commands (run from backend/):
#   .venv/bin/alembic upgrade head     # apply pending migrations
#   .venv/bin/alembic current          # show applied revision
#   .venv/bin/alembic history          # list revisions
[alembic]
script_location = migrations
prepend_sys_path = .
# URL is injected by migrations/env.py; placeholder here.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
